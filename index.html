   if(!e){
     skip++;
     review.push({i, type:"skip", selected:"—", correct:x[2]});
   } else if(+e.value===x[2]){
     correct++;
   } else {
     wrong++;
     review.push({i, type:"wrong", selected:+e.value, correct:x[2]});
   }
 });
 const minus=Math.floor(wrong/4),score=correct-minus;
 const name=(document.getElementById("name").value||"Anonymous").trim();
 let board=JSON.parse(localStorage.getItem("bcs91")||"[]");
 board.push({name,score}); board.sort((a,b)=>b.score-a.score); board=board.slice(0,20);
 localStorage.setItem("bcs91",JSON.stringify(board));
 const rank=board.findIndex(a=>a.name===name&&a.score===score)+1;

 const result=document.getElementById("result");
 result.style.display="block";

 let reviewHTML="";
 if(review.length){
   reviewHTML = `<div class="card" style="margin-top:14px">
   <h3>🔎 যেগুলো ভুল/Skip হয়েছে</h3>
   <p class="small">❌ = ভুল উত্তর &nbsp; | &nbsp; ⚪ = Skip &nbsp; | &nbsp; ✅ = সঠিক উত্তর</p>
   ${review.map(r=>{
     const q=Q[r.i];
     if(r.type==="skip"){
       return `<div style="border:1px solid #f59e0b;border-radius:9px;padding:10px;margin:8px 0">
       <b>⚪ ${r.i+1}. ${q[0]}</b>
       <p style="margin:6px 0">তোমার উত্তর: <b>Skip</b></p>
       <p style="margin:6px 0">✅ সঠিক উত্তর: <b>${["ক","খ","গ","ঘ"][q[2]]}) ${q[1][q[2]]}</b></p>
       </div>`;
     }
     return `<div style="border:1px solid #ef4444;border-radius:9px;padding:10px;margin:8px 0">
       <b>❌ ${r.i+1}. ${q[0]}</b>
       <p style="margin:6px 0">❌ তোমার উত্তর: <b>${["ক","খ","গ","ঘ"][r.selected]}) ${q[1][r.selected]}</b></p>
       <p style="margin:6px 0">✅ সঠিক উত্তর: <b>${["ক","খ","গ","ঘ"][r.correct]}) ${q[1][r.correct]}</b></p>
     </div>`;
   }).join("")}
   </div>`;
 }

 result.innerHTML=`<h2>🎉 ফলাফল</h2><p><b>${name}</b></p>
 <p>সঠিক: ${correct} | ভুল: ${wrong} | Skip: ${skip} | Minus: ${minus}</p>
 <h2>Score: ${score}/91</h2><h3>🏅 Merit: ${rank}</h3>
 <h3>🏆 Leaderboard</h3><table><tr><th>Rank</th><th>Name</th><th>Score</th></tr>
 ${board.map((a,i)=>`<tr><td>${i+1}</td><td>${a.name}</td><td>${a.score}</td></tr>`).join("")}</table>
 ${reviewHTML}`;
 window.scrollTo({top:result.offsetTop-60,behavior:"smooth"});
}
</script>
