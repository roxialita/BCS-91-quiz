const container = document.getElementById('quizContainer');
let html = '';
let currentSection = '';

QUESTIONS.forEach((item, idx) => {
  if (item.section !== currentSection) {
    currentSection = item.section;
    const title = currentSection === 'math'
      ? 'অংশ ১ — গণিত (শতকরা) — ২০টি প্রশ্ন'
      : 'অংশ ২ — বাংলা (বিপরীত শব্দ) — ৫০টি প্রশ্ন';
    html += `<div class="section-title">${title}</div>`;
  }
  html += `<div class="qcard" id="qcard-${item.id}">`;
  html += `<div class="qtext">${item.q}</div>`;
  if (item.src) html += `<div class="qsrc">${item.src}</div>`;
  item.opts.forEach((opt, i) => {
    html += `
      <label class="opt" id="opt-${item.id}-${i}">
        <input type="radio" name="q${item.id}" value="${i}">
        <span>${item.labels[i]}) ${opt}</span>
      </label>`;
  });
  html += `<div class="unanswered" id="unans-${item.id}">⚠️ উত্তর দেওয়া হয়নি</div>`;
  html += `<div class="explain" id="exp-${item.id}"><b>সঠিক উত্তর: ${item.labels[item.ans]}) ${item.opts[item.ans]}</b><br>${item.exp}</div>`;
  html += `</div>`;
});

container.innerHTML = html;

function submitQuiz() {
  let score = 0;
  QUESTIONS.forEach(item => {
    const selected = document.querySelector(`input[name="q${item.id}"]:checked`);
    const expDiv = document.getElementById(`exp-${item.id}`);
    const unansDiv = document.getElementById(`unans-${item.id}`);
    expDiv.classList.add('show');

    if (!selected) {
      unansDiv.classList.add('show');
    } else {
      const chosen = parseInt(selected.value);
      if (chosen === item.ans) {
        score++;
        document.getElementById(`opt-${item.id}-${chosen}`).classList.add('correctPick');
        const chk = document.createElement('span');
        chk.className = 'check';
        chk.textContent = '✔';
        document.getElementById(`opt-${item.id}-${chosen}`).appendChild(chk);
      } else {
        document.getElementById(`opt-${item.id}-${chosen}`).classList.add('wrongPick');
        const cross = document.createElement('span');
        cross.className = 'cross';
        cross.textContent = '❌';
        document.getElementById(`opt-${item.id}-${chosen}`).appendChild(cross);
      }
    }

    // lock all inputs for this question
    document.querySelectorAll(`input[name="q${item.id}"]`).forEach(inp => inp.disabled = true);
  });

  const total = QUESTIONS.length;
  const scoreBar = document.getElementById('scoreBar');
  scoreBar.style.display = 'block';
  scoreBar.textContent = `আপনার স্কোর: ${score} / ${total} (${Math.round(score/total*100)}%)`;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'সাবমিট হয়ে গেছে ✓';

  container.classList.add('locked');

  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
