const SUBJ=["সব","বাংলা সমাস","English Verb","গণিত","GK"];
let sub="সব",list=[],res={};
const app=document.getElementById('app'),pb=document.getElementById('pb');
const L=['ক','খ','গ','ঘ'];
function chips(){document.getElementById('chips').innerHTML=SUBJ.map(s=>{const n=s=="সব"?ALL.length:ALL.filter(x=>x.s==s).length;return '<button class="ch'+(s==sub?' on':'')+'" onclick="setS(\''+s+'\')">'+s+' ('+n+')</button>'}).join('')+'<button class="ch" onclick="shuf()">🔀 Shuffle</button>';
 document.getElementById('tot').textContent='মোট '+ALL.length+'টি প্রশ্ন · যেকোনোটা বেছে উত্তর দিন';}
function setS(s){sub=s;list=ALL.filter(x=>s=="সব"||x.s==s);res={};chips();show();}
function shuf(){list=list.slice().sort(()=>Math.random()-.5);res={};show();}
function stat(){const ks=Object.keys(res),d=ks.length,c=ks.filter(n=>res[n]==list[n].a).length;
 document.getElementById('st').textContent='উত্তর: '+d+' / '+list.length+' · ✅ '+c+' · ❌ '+(d-c);
 pb.style.width=(list.length?d/list.length*100:0)+'%';}
function show(){
 app.innerHTML=list.map((q,n)=>'<div class="card"><div class="s">'+q.s+' · প্রশ্ন '+(n+1)+'</div><div class="q">'+q.q+'</div><div id="c'+n+'">'+
  q.o.map((o,k)=>'<button class="o" onclick="pick('+n+','+k+')">'+L[k]+'. '+o+'</button>').join('')+'</div><div class="fb" id="f'+n+'"></div></div>').join('')
  +'<div style="text-align:center;margin:16px 0"><button class="btn" onclick="setS(sub)">আবার শুরু করুন</button></div>';
 stat();}
function pick(n,k){
 if(res[n]!==undefined)return;res[n]=k;const a=list[n].a;
 document.querySelectorAll('#c'+n+' .o').forEach((b,j)=>{b.disabled=true;if(j==a)b.classList.add('ok');else if(j==k)b.classList.add('no');});
 document.getElementById('f'+n).textContent=k==a?'✅ সঠিক':'❌ সঠিক উত্তর: '+L[a];
 stat();}
setS("সব");
</script></body></html>
